<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<title>Cadastro de Clientes | URBAN STYLE</title>
</head>
<body>
<header class="site" id="site-header"></header>
<main class="page">
  <div class="container narrow">
    <div class="page-head"><h1>Cadastro de Clientes</h1></div>
    <div id="msg" role="status" aria-live="polite" hidden></div>
    <p class="nota" id="nota-edicao" hidden></p>
    <form id="form-cliente" class="card form" novalidate>
      <div class="full">
        <label for="nome">Nome completo</label>
        <input id="nome" name="nome" type="text" maxlength="100" autocomplete="name" required>
        <p class="erro" id="erro-nome"></p>
      </div>
      <div>
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" maxlength="150" autocomplete="email" required>
        <p class="erro" id="erro-email"></p>
      </div>
      <div>
        <label for="telefone">Telefone</label>
        <input id="telefone" name="telefone" type="tel" maxlength="20" placeholder="(11) 91234-5678" autocomplete="tel" required>
        <p class="erro" id="erro-telefone"></p>
      </div>
      <div class="full">
        <label for="endereco">Endereço</label>
        <input id="endereco" name="endereco" type="text" maxlength="200" autocomplete="street-address" required>
        <p class="erro" id="erro-endereco"></p>
      </div>
      <div class="full actions">
        <button class="btn" type="submit" id="btn-salvar">Cadastrar Cliente</button>
        <button class="btn btn-ghost" type="button" id="btn-limpar">Limpar formulário</button>
        <a class="btn btn-ghost" href="clientes.html">Ver clientes</a>
      </div>
    </form>
  </div>
</main>
<footer class="site" id="site-footer"></footer>
<script src="js/common.js"></script>
<script src="js/cadastro.js"></script>
</body>
</html>
